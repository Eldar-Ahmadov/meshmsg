[package]
name = "meshmsg-protocol"
version = "0.1.0"
edition = "2021"
description = "Strict local IPC contracts and bounded framing for meshmsg"
license = "MIT OR Apache-2.0"

[features]
default = []
attachment-authenticity = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-gossip",
    "dep:postcard",
    "dep:serde-byte-array",
]

[dependencies]
data-encoding = "2"
iroh = { version = "1", optional = true }
iroh-blobs = { version = "=0.103.0", default-features = false, optional = true }
iroh-gossip = { version = "0.101", optional = true }
postcard = { version = "1", features = ["alloc", "use-std"], optional = true }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde-byte-array = { version = "0.1", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
