[package]
name = "meshmsg-protocol"
version = "0.1.0"
edition = "2021"
description = "Strict local IPC contracts and bounded framing for meshmsg"
license = "MIT OR Apache-2.0"

[dependencies]
data-encoding = "2"
iroh = "1"
iroh-blobs = { version = "=0.103.0", default-features = false }
iroh-gossip = "0.101"
postcard = { version = "1", features = ["alloc", "use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde-byte-array = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
