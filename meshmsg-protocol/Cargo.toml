[package]
name = "meshmsg-protocol"
version = "0.1.0"
edition = "2021"
description = "Strict local IPC contracts and bounded framing for meshmsg"
license = "MIT OR Apache-2.0"

[dependencies]
data-encoding = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
