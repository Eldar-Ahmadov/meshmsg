[workspace]
members = ["meshmsg-protocol"]
default-members = [".", "meshmsg-protocol"]
resolver = "2"

[package]
name = "meshmsg"
version = "0.1.20"
edition = "2021"
description = "Small peer-to-peer messaging and file-sharing CLI built on Iroh"
license = "MIT OR Apache-2.0"

[features]
default = []
bench = []
bench-tui = ["bench", "dep:crossterm", "dep:ratatui"]

[[bin]]
name = "meshmsg-bench"
path = "src/bin/meshmsg-bench.rs"
required-features = ["bench"]

[[bin]]
name = "meshmsg-bench-tui"
path = "src/bin/meshmsg-bench-tui.rs"
required-features = ["bench-tui"]

[dependencies]
anyhow = "1"
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", optional = true }
data-encoding = "2"
dirs = "6"
futures-util = "0.3"
hostname = "0.4"
fs2 = "0.4"
libc = "0.2"
iroh = "1"
meshmsg-protocol = { path = "meshmsg-protocol" }
iroh-blobs = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-gossip = "0.101"
postcard = { version = "1", features = ["alloc", "use-std"] }
rand = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
serde = { version = "1", features = ["derive"] }
serde-byte-array = "0.1"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tar = "0.4"

[dev-dependencies]
bao-tree = "0.16"

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "event"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
