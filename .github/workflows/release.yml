name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# One immutable tag has one non-cancelling publisher. A rerun replaces only an
# existing draft and never overwrites an already-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Initial release admission
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require tip admission or prove this run was admitted previously
        id: release-eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash tests/check-release-admission.sh "$RELEASE_TAG" "$RELEASE_SHA" "$RUN_ID" "$RUN_ATTEMPT"

  verification:
    needs: validate-tag
    uses: ./.github/workflows/verification.yml
    permissions:
      contents: read

  audit-protections:
    needs: verification
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed unless live GitHub protections match canonical policy
        id: live-protection-audit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PROTECTION_AUDIT_TOKEN }}
        run: scripts/github-release-protections.sh --ci-check

  linux:
    needs: audit-protections
    # GNU binaries built on this older baseline run on that glibc and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain targets and musl linker
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build final locked release binaries
        id: release-build-linux
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package Linux archives
        id: release-package-linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            name="meshmsg-${GITHUB_REF_NAME}-${target}"
            mkdir -p "dist/${name}"
            install -m 0755 "target/${target}/release/meshmsg" "dist/${name}/meshmsg"
            install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
            cp -R docs "dist/${name}/docs"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -rf "dist/${name}"
          done
      - name: Inspect and smoke-test final packaged GNU and musl binaries
        id: release-smoke-linux
        run: >-
          python3 tests/verify-release-assets.py --platform linux
          --tag "$GITHUB_REF_NAME" --dist dist --binary-root target --execute
      - name: Upload exact Linux archives
        id: release-upload-linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: |
            dist/meshmsg-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            dist/meshmsg-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: audit-protections
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      # Keep the release archive self-contained on clean Windows hosts.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Build final locked static-CRT Windows release binary
        id: release-build-windows
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows archive
        id: release-package-windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "x86_64-pc-windows-msvc"
          $name = "meshmsg-$env:GITHUB_REF_NAME-$target"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/$target/release/meshmsg.exe" "dist/$name/meshmsg.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Copy-Item docs "dist/$name/docs" -Recurse
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - name: Resolve dumpbin from the canonical x64 MSVC environment
        id: release-resolve-dumpbin
        shell: pwsh
        run: ./tests/resolve-dumpbin.ps1
      - name: Inspect and smoke-test final packaged Windows binary and static CRT
        id: release-smoke-windows
        shell: pwsh
        env:
          DUMPBIN: ${{ steps.release-resolve-dumpbin.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          python tests/verify-release-assets.py --platform windows --tag "$env:GITHUB_REF_NAME" --dist dist --binary-root target --execute
          $dependencies = & $env:DUMPBIN /dependents "target/x86_64-pc-windows-msvc/release/meshmsg.exe" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed: $dependencies" }
          if ($dependencies -match '(?im)\b(?:VCRUNTIME|MSVCP)[^\s]*\.dll\b') { throw "release binary dynamically depends on the MSVC runtime: $dependencies" }
      - name: Upload exact Windows archive
        id: release-upload-windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/meshmsg-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact Linux artifact
        id: download-linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux
          path: incoming/linux
      - name: Download exact Windows artifact
        id: download-windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: incoming/windows
      - name: Reject extra assets and inspect exact archive contents
        id: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 tests/verify-release-assets.py --platform all --tag "$RELEASE_TAG"
          --incoming incoming --dist dist
      - name: Generate unified checksums
        id: release-checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archives=(
            "meshmsg-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            "meshmsg-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz"
            "meshmsg-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
          )
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum "${archives[@]}" >SHA256SUMS
      - name: Reaudit live protections immediately before publication
        id: final-live-protection-audit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PROTECTION_AUDIT_TOKEN }}
        run: scripts/github-release-protections.sh --ci-check
      - name: Publish exact-SHA release fail closed
        id: release-publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PROTECTION_AUDIT_TOKEN: ${{ secrets.RELEASE_PROTECTION_AUDIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            if test "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true; then
              echo "refusing to overwrite already-published release $tag" >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          git show "$RELEASE_SHA:.github/release-notes/${tag}.md" >"$notes_file"
          # Re-fetch and resolve the remote tag in the command immediately before
          # creating a draft explicitly targeted at the event commit.
          bash tests/check-release-eligibility.sh recheck "$tag" "$RELEASE_SHA"
          gh release create "$tag" --draft --verify-tag --target "$RELEASE_SHA" \
            --notes-file "$notes_file" --title "meshmsg $tag"
          gh release upload "$tag" \
            "dist/meshmsg-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/meshmsg-${tag}-x86_64-unknown-linux-musl.tar.gz" \
            "dist/meshmsg-${tag}-x86_64-pc-windows-msvc.zip" \
            dist/SHA256SUMS
          # Reaudit policy, then re-resolve the tag, immediately before making
          # the draft public. The read-only audit token is never used to publish.
          GH_TOKEN="$RELEASE_PROTECTION_AUDIT_TOKEN" scripts/github-release-protections.sh --ci-check
          bash tests/check-release-eligibility.sh recheck "$tag" "$RELEASE_SHA"
          gh release edit "$tag" --target "$RELEASE_SHA" --draft=false
