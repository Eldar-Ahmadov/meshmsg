name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    permissions:
      contents: read

  required:
    name: Required verification
    if: ${{ always() }}
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require exact-SHA reusable verification
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: test "$VERIFICATION_RESULT" = success
