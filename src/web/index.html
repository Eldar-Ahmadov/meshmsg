<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meshmsg · Broadcast</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main>
<header class="masthead">
<div>
<h1>meshmsg</h1>
<p class="eyebrow">Live topic console</p>
</div>
<div class="masthead-actions">
<div class="connection-state">
<p id="connection" role="status">Connecting live feed…</p>
<p id="status" role="status">Checking peer summary…</p>
</div>
<a class="settings-link" href="/settings" aria-label="Open meshmsg status">
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.6 2h4.8l.6 2.4c.5.2 1 .5 1.4.8l2.3-.7 2.4 4.1-1.8 1.7a8 8 0 0 1 0 1.6l1.8 1.7-2.4 4.1-2.3-.7c-.4.3-.9.6-1.4.8l-.6 2.4H9.6L9 17.8c-.5-.2-1-.5-1.4-.8l-2.3.7-2.4-4.1 1.8-1.7a8 8 0 0 1 0-1.6L2.9 8.6l2.4-4.1 2.3.7c.4-.3.9-.6 1.4-.8L9.6 2Z"/><circle cx="12" cy="11.2" r="3"/></svg>
</a>
</div>
</header>
<section class="stream" aria-labelledby="feed-heading">
<div class="feed-heading"><div><p class="eyebrow">Now</p><h2 id="feed-heading">Live feed</h2></div><button id="clear" class="quiet" type="button">Clear</button></div>
<p id="gap" role="status"></p>
<ol id="feed" aria-label="Messages and attachment offers, newest first" aria-live="polite" aria-relevant="additions"></ol>
</section>
<section class="compose" aria-labelledby="compose-heading">
<h2 id="compose-heading">Broadcast</h2>
<form id="composer">
<label class="visually-hidden" for="draft">Message or attachment to this daemon's topic</label>
<div id="composer-box" class="composer-box">
<textarea id="draft" rows="2" placeholder="Message the topic…" aria-describedby="size outcome" spellcheck="true"></textarea>
<div id="selected-attachment" class="selected-attachment" hidden>
<span class="selected-file-icon" aria-hidden="true">▱</span>
<span id="selected-file-name"></span>
<span id="selected-file-size"></span>
<button id="remove-attachment" class="remove-attachment" type="button" aria-label="Remove selected attachment">×</button>
</div>
<div class="composer-tools">
<label class="attachment-picker" for="attachment"><span aria-hidden="true">+</span> Attach file</label>
<input id="attachment" class="visually-hidden" type="file" aria-describedby="outcome">
<div class="composer-actions"><span class="shortcut">Ctrl+Enter</span><button id="broadcast" type="submit">Send</button></div>
</div>
<div id="drop-prompt" aria-hidden="true">Drop file to share</div>
</div>
<p id="size" class="visually-hidden">0 / 4096 UTF-8 bytes</p>
<p id="outcome" role="status" aria-live="polite"></p>
</form>
</section>
<noscript>JavaScript is required to use the broadcast UI.</noscript>
</main>
</body>
</html>
